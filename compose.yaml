# 開発環境用。本番の構成はフェーズ7で docs/deploy.md にまとめる。
services:
  db:
    image: postgres:16
    environment:
      # ローカル開発専用の値。本番では使わない
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rise_knowledge_dev
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile.dev
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/rise_knowledge_dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npm run dev -- --hostname 0.0.0.0"

volumes:
  db-data:
  node_modules:
